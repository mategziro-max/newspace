<!DOCTYPE html>
<html lang="ka" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin | New Space</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="admin.css">
</head>
<body class="admin">

<div id="loginView" class="login">
  <form id="loginForm" class="login-card">
    <img src="logo.png" alt="">
    <h2>New Space Admin</h2>
    <label>Email</label><input type="email" id="email" required>
    <label style="margin-top:12px">პაროლი</label><input type="password" id="pass" required>
    <button class="btn block" style="margin-top:20px">შესვლა</button>
    <div class="msg" id="loginMsg"></div>
  </form>
</div>

<div id="app" hidden>
  <aside class="side">
    <div class="side-brand"><img src="logo.jpg" alt=""><div><b>New Space</b><small>ADMIN</small></div></div>
    <nav id="sideNav">
      <button data-tab="dash" class="on">📊 <span>მიმოხილვა</span></button>
      <button data-tab="res">📅 <span>დაჯავშნები</span> <i class="count" id="pendCount" hidden></i></button>
      <button data-tab="tables">🪑 <span>მაგიდები</span></button>
      <button data-tab="menu">🍽️ <span>მენიუ</span></button>
      <button data-tab="reviews">⭐ <span>შეფასებები</span></button>
      <button data-tab="gallery">🖼️ <span>გალერეა</span></button>
      <button data-tab="settings">⚙️ <span>პარამეტრები</span></button>
    </nav>
    <div class="side-foot">
      <a href="index.html" target="_blank">🌐 საიტი</a>
      <button id="themeBtn" aria-label="theme"></button>
      <button id="logout">გასვლა</button>
    </div>
  </aside>
  <main class="content" id="view"></main>
</div>

<div id="toasts"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.min.js"></script>
<script src="supabase.js"></script>
<script src="admin.js"></script>
</body>
</html>
